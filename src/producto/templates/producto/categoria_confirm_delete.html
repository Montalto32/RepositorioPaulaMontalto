<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eliminar categoría</title>
</head>
<body>

<h1>Categorías: Eliminar</h1>

<p>
    ¿Está seguro que desea eliminar la categoría "{{ object.nombre }}"?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Confirmo</button>

    <a href="{% url 'producto:categoria_home' %}">
        Cancelar
    </a>
</form>

</body>
</html>
