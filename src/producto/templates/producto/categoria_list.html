<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<h1>Categorías</h1>
<form method get >

<button><a href="{% "producto:categoria_create" categoria.id %}">Crear</a>"</button>

<ul>

        <a href="{% "producto:categoria_update" categoria.id %}">Editar</a>

    </p>
{% endfor %}
</ul>
